[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/m96-chan/PAIR4Droid"

[workspace.dependencies]
pair-protocol = { path = "crates/pair-protocol" }
pair-engine = { path = "crates/pair-engine" }
pair-telemetry = { path = "crates/pair-telemetry" }
pair-node = { path = "crates/pair-node" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
http = "1"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uniffi = "0.32"
