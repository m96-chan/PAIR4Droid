[package]
name = "pair-engine"
description = "Inference engine abstraction (mock + llama.cpp backend) for PAIR4Droid"
version.workspace = true
edition.workspace = true
repository.workspace = true

[features]
default = []
# Real llama.cpp backend (needs cmake + a C/C++ toolchain; on Android needs NDK).
llama = ["dep:llama-cpp-2"]

[dependencies]
async-trait.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
parking_lot.workspace = true
chrono.workspace = true
sha2 = "0.10"
hex = "0.4"
llama-cpp-2 = { version = "0.1.156", optional = true, default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
