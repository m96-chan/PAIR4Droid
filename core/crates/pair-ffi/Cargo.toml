[package]
name = "pair-ffi"
description = "UniFFI bindings exposing the node to the Android (Kotlin) app"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "pair4droid_ffi"

# The bindings generator ships as a binary of this crate (ADR-0002). It pulls in
# clap + uniffi_bindgen, which have no business inside the cdylib we ship on the
# phone, so it lives behind the `bindgen` feature. See README.md for the command.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
llama = ["pair-engine/llama"]
bindgen = ["uniffi/cli"]

[dependencies]
pair-protocol.workspace = true
pair-engine.workspace = true
pair-telemetry.workspace = true
pair-node.workspace = true
uniffi.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true

# No `[build-dependencies] uniffi` / build.rs: this crate is proc-macro mode
# (`uniffi::setup_scaffolding!`), there is no UDL to compile.

[dev-dependencies]
reqwest.workspace = true
serde_json.workspace = true
