[package]
name = "pair-ffi"
description = "UniFFI bindings exposing the node to the Android (Kotlin) app"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "pair4droid_ffi"

[features]
default = []
llama = ["pair-engine/llama"]

[dependencies]
pair-protocol.workspace = true
pair-engine.workspace = true
pair-telemetry.workspace = true
pair-node.workspace = true
uniffi.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
